name: Native Player Reference Analysis
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/native-reference-analysis.yml']
permissions:
  contents: read
jobs:
  reference:
    runs-on: macos-15
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        version: ['26.6.2', '27.0']
    steps:
      - uses: actions/checkout@v4
      - run: |
          brew trust blacktop/tap || true
          brew install blacktop/tap/ipsw
      - name: Extract reference and resolve Swift metadata in shared-cache context
        run: |
          bash analysis/run.sh '${{ matrix.version }}' '' iPhone17,3
          TAG=$(echo '${{ matrix.version }}' | tr '.' '_')
          DSC=$(find "ipsw_$TAG" -name dyld_shared_cache_arm64e -type f -print -quit)
          test -n "$DSC"
          ipsw -V dyld macho "$DSC" MediaCoreUI --objc --swift --swift-all --symbols --loads > "out/$TAG/MediaCoreUI-native.txt" 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-player-reference-${{ matrix.version }}
          path: out/
          retention-days: 30
