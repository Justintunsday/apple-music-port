name: iOS 16 Native Player Analysis
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'analysis/ios16-native.sh'
      - 'analysis/summarize-native.py'
      - '.github/workflows/ios16-native-analysis.yml'
permissions:
  contents: read
jobs:
  analyze:
    runs-on: macos-15
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - name: Install firmware analysis tool
        run: |
          brew trust blacktop/tap || true
          brew install blacktop/tap/ipsw
      - name: Extract and inspect iOS 16.1.1 (20B101)
        run: bash analysis/ios16-native.sh
      - name: Publish evidence
        if: always()
        run: |
          if test -f out/16_1_1/findings.txt; then head -n 500 out/16_1_1/findings.txt; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios16-1-1-native-player-analysis
          path: out/
          retention-days: 30
          if-no-files-found: error
