name: iOS 27 Prototype Simulator

on:
  workflow_dispatch:
  push:
    branches: [codex/ios27-simulator]
    paths:
      - "prototype/**"
      - ".github/workflows/ios27-prototype-sim.yml"

jobs:
  screenshot:
    runs-on: xcode-27
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain and simulator runtimes
        run: |
          xcodebuild -version
          xcrun simctl list runtimes
          xcrun simctl list devices available | sed -n '1,160p'

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate and build prototype (iOS 27 SDK)
        run: |
          cd prototype
          xcodegen generate
          xcodebuild \
            -project MusicLandscapePrototype.xcodeproj \
            -scheme MusicLandscapePrototype \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build
          ls -la "build/Build/Products/Debug-iphonesimulator/"

      - name: Pick an iOS 27 iPhone SE simulator
        id: sim
        run: |
          RUNTIME=$(xcrun simctl list runtimes -j \
            | jq -r '.runtimes[] | select(.identifier | test("iOS-27")) | .identifier' | head -n 1)
          SE_TYPE=$(xcrun simctl list devicetypes -j \
            | jq -r '.devicetypes[] | select(.name | test("iPhone SE \\(3rd generation\\)|iPhone SE \\(2nd generation\\)")) | .identifier' | head -n 1)
          UDID=""
          if [ -n "$RUNTIME" ] && [ -n "$SE_TYPE" ] && [ "$SE_TYPE" != "null" ]; then
            UDID=$(xcrun simctl list devices -j \
              | jq -r --arg rt "$RUNTIME" --arg dt "$SE_TYPE" \
                '[.devices[] | to_entries[] | select(.key == $rt) | .value[] | select(.deviceTypeIdentifier == $dt and .isAvailable)][0].udid // empty')
            if [ -z "$UDID" ]; then
              UDID=$(xcrun simctl create "MusicLandscape-iPhoneSE" "$SE_TYPE" "$RUNTIME" || true)
            fi
          fi
          if [ -z "$UDID" ]; then
            echo "iPhone SE device type unavailable; falling back to a standard iPhone" >&2
            UDID=$(xcrun simctl list devices available -j \
              | jq -r '[.devices | to_entries[] | select(.key | test("iOS-27")) | .value[] | select(.name | startswith("iPhone"))][0].udid // empty')
          fi
          if [ -z "$UDID" ]; then
            echo "No iOS 27 iPhone simulator found" >&2
            xcrun simctl list runtimes >&2
            xcrun simctl list devicetypes >&2
            exit 1
          fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices | grep "$UDID" || true

      - name: Boot, install, launch and screenshot
        run: |
          UDID="${{ steps.sim.outputs.udid }}"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override \
            --time "9:41" --batteryState charged --batteryLevel 100 \
            --cellularBars 4 --wifiBars 3 || true
          APP="prototype/build/Build/Products/Debug-iphonesimulator/MusicLandscapePrototype.app"
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch --terminate-running-process "$UDID" com.justintunsday.musiclandscape.prototype
          sleep 6
          mkdir -p prototype/screenshots
          xcrun simctl io "$UDID" screenshot prototype/screenshots/raw-ios27.png
          WIDTH=$(sips -g pixelWidth prototype/screenshots/raw-ios27.png | awk '/pixelWidth/ {print $2}')
          HEIGHT=$(sips -g pixelHeight prototype/screenshots/raw-ios27.png | awk '/pixelHeight/ {print $2}')
          echo "raw ${WIDTH}x${HEIGHT}"
          if [ "$HEIGHT" -gt "$WIDTH" ]; then
            sips -r 270 prototype/screenshots/raw-ios27.png --out prototype/screenshots/ios27.png >/dev/null
          else
            cp prototype/screenshots/raw-ios27.png prototype/screenshots/ios27.png
          fi
          sips -g pixelWidth -g pixelHeight prototype/screenshots/ios27.png
          xcodebuild -version > prototype/screenshots/runtime.txt
          xcrun simctl list devices available | grep "$UDID" >> prototype/screenshots/runtime.txt || true

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: music-landscape-prototype-ios27
          path: prototype/screenshots/
          if-no-files-found: warn
          retention-days: 30
