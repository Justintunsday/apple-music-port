name: Build Rootless Deb

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tweak/**'
      - '.github/workflows/rootless-deb.yml'
      - 'tests/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      THEOS: ${{ github.workspace }}/.theos-toolchain
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: brew install ldid dpkg
      - name: Install Theos
        run: git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
      - name: Build rootless package (iOS 16 and 26)
        run: |
          set -o pipefail
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          git -C "$THEOS" rev-parse HEAD
          make -C tweak clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless 2>&1 | tee build.log
      - name: Verify package and Mach-O
        run: |
          set -euo pipefail
          DEB=$(find tweak/packages -name '*.deb' -print -quit)
          test -n "$DEB"
          test "$(dpkg-deb -f "$DEB" Architecture)" = iphoneos-arm64
          mkdir -p package-check
          dpkg-deb -x "$DEB" package-check
          DYLIB=package-check/var/jb/Library/MobileSubstrate/DynamicLibraries/MusicLandscape.dylib
          test -f "$DYLIB"
          test -f package-check/var/jb/Library/MobileSubstrate/DynamicLibraries/MusicLandscape.plist
          test ! -d package-check/Library
          lipo "$DYLIB" -verify_arch arm64 arm64e
          xcrun vtool -show-build "$DYLIB" | tee macho-build.txt
          grep -q 'minos 16.0' macho-build.txt
          otool -L "$DYLIB" | tee macho-libraries.txt
          dpkg-deb -I "$DEB"
          dpkg-deb -c "$DEB"
          shasum -a 256 "$DEB" > "$DEB.sha256"
      - name: Upload deb and build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: music-landscape-rootless-ios16-ios26
          path: |
            tweak/packages/*.deb
            tweak/packages/*.sha256
            build.log
            macho-*.txt
          if-no-files-found: error
          retention-days: 30

  simulator-regression:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - name: Build overlay regression host
        run: |
          python3 tests/prepare_smoke.py
          cd tests
          xcodegen generate
          xcodebuild -project LandscapeSmoke.xcodeproj -scheme LandscapeSmoke -sdk iphonesimulator -configuration Debug -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Exercise slow media service, close, layout and playback
        timeout-minutes: 5
        run: |
          set -euo pipefail
          SDK=$(xcrun --sdk iphonesimulator --show-sdk-version | tr '.' '-')
          xcrun simctl list devices available
          UDID=$(xcrun simctl list devices available -j | jq -r --arg runtime "iOS-$SDK" '[.devices | to_entries[] | select(.key | endswith($runtime)) | .value[] | select(.name | startswith("iPhone"))][0].udid')
          test -n "$UDID" && test "$UDID" != null
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" tests/build/Build/Products/Debug-iphonesimulator/LandscapeSmoke.app
          xcrun simctl launch "$UDID" com.justintunsday.landscape.smoke
          DATA=$(xcrun simctl get_app_container "$UDID" com.justintunsday.landscape.smoke data)
          for attempt in {1..30}; do
            if test -f "$DATA/Documents/smoke-result.txt"; then break; fi
            sleep 1
          done
          cp "$DATA/Documents/smoke-result.txt" smoke-result.txt
          cat smoke-result.txt
          grep -qx PASS smoke-result.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-regression-result
          path: smoke-result.txt
          if-no-files-found: warn

