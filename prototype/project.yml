name: MusicLandscapePrototype
options:
  bundleIdPrefix: com.justintunsday
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  MusicLandscapePrototype:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.justintunsday.musiclandscape.prototype
        PRODUCT_NAME: MusicLandscapePrototype
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Music Landscape
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO

schemes:
  MusicLandscapePrototype:
    build:
      targets:
        MusicLandscapePrototype: all
